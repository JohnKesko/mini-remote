[package]
name = "mini-remote-discovery"
description = "Finds VNC computers (especially Raspberry Pis) on the local network"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "discovery"

[dependencies]
tokio.workspace = true
log.workspace = true
mdns-sd = "0.21"
if-addrs = "0.15"
dns-lookup = "4"

[dev-dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
