[package]
name = "mini-remote-rfb"
description = "VNC (RFB protocol) client sessions for the Mini Remote app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rfb"

[dependencies]
mini-remote-codec.workspace = true
tokio.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
eax = "0.5"
des = "0.8"
rand = "0.8"
flate2 = "1"

[dev-dependencies]
png = "0.17"
env_logger = "0.11"
